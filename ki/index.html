<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A4-3</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>h</header>
    <main>
        <div class="grid-container">
        <!-- Top Section -->
        <div class="item top-left-sm"></div>
        <div class="item top-banner"></div>
        <div class="item top-right-sm"></div>

        <!-- Notches -->
        <div class="item notch-left"></div>
        <div class="item notch-right"></div>

        <!-- Outer Columns -->
        <div class="item left-sq-1"></div>
        <div class="item left-sq-2"></div>
        <div class="item right-sq-1"></div>
        <div class="item right-sq-2"></div>

        <!-- Inner Section -->
        <div class="item inner-left-1"></div>
        <div class="item inner-left-2"></div>

        <div class="item center-pill">Center Tall</div>

        <div class="item inner-right-1"></div>
        <div class="item inner-right-2"></div>

        <!-- L-Shaped Left Block -->
        <div class="l-shape-left">
            <div class="l-left-part"></div>
            <div class="l-bottom-part"></div>
        </div>

        <!-- L-Shaped Right Block -->
        <div class="l-shape-right">
            <div class="r-left-part"></div>
            <div class="r-right-part"></div>
        </div>

        <!-- Bottom Rows -->
        <div class="item bottom-center"></div>

        <div class="item footer-left"></div>
        <div class="item footer-center"></div>
        <div class="item footer-right"></div>
    </div>
    </main>
</body>
</html>
